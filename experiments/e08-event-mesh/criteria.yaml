# E8: event mesh multi-región con autorización. Umbrales de 03-experiments.md (E8 y sección 1).
# Calibración: ninguno distinto del documento; match_ratio_min es nuevo (sanidad de la carga, no de negocio).
# --- flujo normal (120 s): r1 ~10 pares/s y r2 ~3 pares/s ---
- id: normal-r1-delivered
  description: r1 normal - todo match de r1 llega a billing (matches sin entregar)
  metric: "metrics.json:$.normal.r1.missing"
  op: eq
  value: 0
- id: normal-r1-matches
  description: r1 normal - la carga produjo matches (ratio matches/pares enviados)
  metric: "metrics.json:$.normal.r1.match_ratio"
  op: ge
  value: 0.9
- id: normal-r2-delivered
  description: r2 normal - todo match de r2 llega a billing (matches sin entregar)
  metric: "metrics.json:$.normal.r2.missing"
  op: eq
  value: 0
- id: normal-r2-matches
  description: r2 normal - la carga produjo matches (ratio matches/pares enviados)
  metric: "metrics.json:$.normal.r2.match_ratio"
  op: ge
  value: 0.9
- id: normal-r1-p99
  description: r1 normal - p99 de receivedAt - emittedAt (s)
  metric: "metrics.json:$.normal.r1.emit_p99_s"
  op: le
  value: 10
- id: normal-r2-p99
  description: r2 normal - p99 de receivedAt - emittedAt (s)
  metric: "metrics.json:$.normal.r2.emit_p99_s"
  op: le
  value: 10
- id: normal-r1-e2e-p99
  description: r1 normal - p99 de receivedAt - occurredAt (s)
  metric: "metrics.json:$.normal.r1.e2e_p99_s"
  op: le
  value: 10
- id: normal-r2-e2e-p99
  description: r2 normal - p99 de receivedAt - occurredAt (s)
  metric: "metrics.json:$.normal.r2.e2e_p99_s"
  op: le
  value: 10
- id: normal-duplicates
  description: Efectos duplicados en billing en todas las fases
  metric: "metrics.json:$.partition.billing_duplicates"
  op: eq
  value: 0
- id: normal-false-rejects
  description: Falsos rechazos del flujo legítimo (mesh_publish_rejected_total durante la fase normal)
  metric: "metrics.json:$.normal.false_rejects"
  op: eq
  value: 0
# --- negativos: 4 casos x 20 intentos ---
- id: neg-attempts
  description: Intentos negativos ejecutados (4 casos x 20)
  metric: "metrics.json:$.negatives.attempts"
  op: eq
  value: 80
- id: neg-rejected
  description: Intentos rechazados (80/80)
  metric: "metrics.json:$.negatives.rejected"
  op: eq
  value: 80
- id: neg-rejected-by-authz
  description: Rechazados por autorización (acl o authn), no por fallos de red
  metric: "metrics.json:$.negatives.rejected_by_authorization"
  op: eq
  value: 80
- id: neg-stream-untouched
  description: Mensajes nuevos en el stream BILLING_MATCHED durante los negativos (last_seq)
  metric: "metrics.json:$.negatives.stream_seq_delta"
  op: eq
  value: 0
- id: neg-billing-untouched
  description: Entregas nuevas en billing durante los negativos
  metric: "metrics.json:$.negatives.billing_total_delta"
  op: eq
  value: 0
# --- partición r2 <-> global ---
- id: part-link-down
  description: El timeline de /leafz muestra el enlace caído (muestras con global=1 y r2=0)
  metric: "metrics.json:$.partition.leafz.down_samples"
  op: ge
  value: 3
- id: part-duration
  description: Duración del corte (s)
  metric: "metrics.json:$.partition.duration_s"
  op: ge
  value: 120
- id: part-local-transfer
  description: Transferencia local de r2 durante el corte (matches vencidos ya aplicados en device-sim r2 / matches vencidos)
  metric: "metrics.json:$.partition.local_ratio"
  op: eq
  value: 1
- id: part-device-growth
  description: device-sim r2 crece durante el corte (comandos distintos nuevos)
  metric: "metrics.json:$.partition.device_growth_during_cut"
  op: ge
  value: 50
- id: part-bridge-retains
  description: El lag del grupo mesh-bridge de r2 crece durante el corte (máximo de mensajes en espera)
  metric: "metrics.json:$.partition.lag_r2_max_during_cut"
  op: ge
  value: 20
- id: part-lag-recovered
  description: El lag del grupo mesh-bridge de r2 vuelve a 0
  metric: "metrics.json:$.partition.lag_r2_last"
  op: eq
  value: 0
- id: part-r2-loss
  description: Matches de r2 creados en la partición que no llegan a billing (pérdida)
  metric: "metrics.json:$.partition.r2.missing"
  op: eq
  value: 0
- id: part-r2-matches
  description: La carga de r2 durante el corte produjo matches
  metric: "metrics.json:$.partition.r2.matches"
  op: ge
  value: 100
- id: part-drain
  description: Drenado de r2 tras restaurar el enlace (s hasta el último match en billing)
  metric: "metrics.json:$.partition.drain_s"
  op: le
  value: 60
- id: part-r1-unaffected
  description: r1 sigue entregando durante el corte (matches sin entregar)
  metric: "metrics.json:$.partition.r1.missing"
  op: eq
  value: 0
- id: part-r1-p99
  description: p99 de r1 durante el corte (s)
  metric: "metrics.json:$.partition.r1.emit_p99_s"
  op: le
  value: 10
- id: part-device-duplicates
  description: Efectos duplicados en device-sim r2 de los matches de la partición
  metric: "metrics.json:$.partition.device_duplicates_final"
  op: eq
  value: 0
- id: part-links-restored
  description: Leafnodes del hub al final (2) y de r2 (1)
  metric: "metrics.json:$.partition.leafz.final_global_leafs"
  op: eq
  value: 2
