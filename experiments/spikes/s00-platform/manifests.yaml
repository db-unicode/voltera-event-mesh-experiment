# Cargas de prueba de S0: httpbin y un cliente con sidecar, y un cliente sin sidecar en otro namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: s00-mesh
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: s00-plain
  labels:
    istio-injection: disabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: s00-mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: s00-mesh
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: s00-mesh
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: s00-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.26.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: s00-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      serviceAccountName: curl
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-plain
  namespace: s00-plain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl-plain
  template:
    metadata:
      labels:
        app: curl-plain
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
