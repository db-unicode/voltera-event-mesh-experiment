# Nodo NATS de la región R1. Credenciales de desarrollo: este repo es un experimento.
server_name: nats-r1
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Enlace saliente hacia el nodo global (leafnode). Se autentica como leaf-r1 y entra a la cuenta MESH.
leafnodes {
  remotes = [
    {
      url: "nats-leaf://leaf-r1:dev-leaf-r1-9f3a@nats.voltera-global.svc.cluster.local:7422"
      account: MESH
    }
  ]
}

accounts {
  MESH {
    users = [
      # solo publica sus eventos; _INBOX.> es para recibir el PubAck del stream global
      {user: bridge-r1, password: "dev-bridge-r1-41c7", permissions: {
        publish: {allow: ["energy.matched.r1.>"]}
        subscribe: {allow: ["_INBOX.>"]}
      }}
      # credencial válida sin permisos útiles
      {user: rogue, password: "dev-rogue-77d2", permissions: {
        publish: {deny: [">"]}
        subscribe: {deny: [">"]}
      }}
    ]
  }
}
