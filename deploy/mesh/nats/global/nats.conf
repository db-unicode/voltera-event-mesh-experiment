# Nodo NATS global: hub de los leafnodes de R1/R2 y único nodo con JetStream.
# Credenciales de desarrollo: este repo es un experimento.
server_name: nats-global
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 1GB
}

# Enlaces entrantes de las regiones (sin bloque authorization: los leafnodes se autentican con los
# usuarios de la cuenta, y sus permisos aplican al enlace).
leafnodes {
  port: 7422
}

accounts {
  MESH {
    jetstream: enabled
    users = [
      # Un usuario por región para el enlace. Cada región solo puede inyectar sus subjects, aunque su nodo
      # regional estuviera comprometido; _INBOX.> deja volver el PubAck a quien publicó.
      {user: leaf-r1, password: "dev-leaf-r1-9f3a", permissions: {
        publish: {allow: ["energy.matched.r1.>"]}
        subscribe: {allow: ["_INBOX.>"]}
      }}
      {user: leaf-r2, password: "dev-leaf-r2-5b1e", permissions: {
        publish: {allow: ["energy.matched.r2.>"]}
        subscribe: {allow: ["_INBOX.>"]}
      }}
      # administra el stream y el consumer (Job de mesh:up y evidencia del spike)
      {user: admin, password: "dev-admin-c0de"}
      # Facturación: consumer durable "billing" del stream BILLING_MATCHED y nada más
      {user: billing, password: "dev-billing-2a94", permissions: {
        publish: {allow: [
          "$JS.API.CONSUMER.INFO.BILLING_MATCHED.billing",
          "$JS.API.CONSUMER.MSG.NEXT.BILLING_MATCHED.billing",
          "$JS.ACK.BILLING_MATCHED.billing.>"
        ]}
        subscribe: {allow: ["_INBOX.>", "energy.matched.>"]}
      }}
      {user: rogue, password: "dev-rogue-77d2", permissions: {
        publish: {deny: [">"]}
        subscribe: {deny: [">"]}
      }}
    ]
  }
}
