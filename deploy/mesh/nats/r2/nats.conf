# Nodo NATS de la región R2. Credenciales de desarrollo: este repo es un experimento.
server_name: nats-r2
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Enlace saliente hacia el nodo global (leafnode). Se autentica como leaf-r2 y entra a la cuenta MESH.
leafnodes {
  remotes = [
    {
      url: "nats-leaf://leaf-r2:dev-leaf-r2-5b1e@nats.voltera-global.svc.cluster.local:7422"
      account: MESH
    }
  ]
}

accounts {
  MESH {
    users = [
      # solo publica sus eventos; _INBOX.> es para recibir el PubAck del stream global
      {user: bridge-r2, password: "dev-bridge-r2-8e60", permissions: {
        publish: {allow: ["energy.matched.r2.>"]}
        subscribe: {allow: ["_INBOX.>"]}
      }}
      # credencial válida sin permisos útiles
      {user: rogue, password: "dev-rogue-77d2", permissions: {
        publish: {deny: [">"]}
        subscribe: {deny: [">"]}
      }}
    ]
  }
}
