# Consume meter-declarations (RabbitMQ) y escribe positions-db + outbox. Lo escala KEDA por profundidad de cola
# (scaledobject.yaml) desde 0; replicas: 0 aquí para que un `apply` no pise lo que KEDA decidió con un 1.
# Las credenciales de RabbitMQ están en el Secret declaration-gateway-rabbitmq (lo crea `mise run apps:write-side`
# copiando solo la contraseña de este servicio desde voltera-infra).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: declaration-gateway
spec:
  replicas: 0
  selector:
    matchLabels: {}
  template:
    metadata:
      labels: {}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: declaration-gateway
      terminationGracePeriodSeconds: 30
      containers:
        - name: declaration-gateway
          image: voltera/declaration-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: PG_USER
              valueFrom: {secretKeyRef: {name: positions-db-credentials, key: POSTGRES_USER}}
            - name: PG_PASSWORD
              valueFrom: {secretKeyRef: {name: positions-db-credentials, key: POSTGRES_PASSWORD}}
            - name: PG_DB
              valueFrom: {secretKeyRef: {name: positions-db-credentials, key: POSTGRES_DB}}
            - name: DATABASE_URL
              value: postgres://$(PG_USER):$(PG_PASSWORD)@positions-db:5432/$(PG_DB)?sslmode=disable
            - name: AMQP_USER
              valueFrom: {secretKeyRef: {name: declaration-gateway-rabbitmq, key: AMQP_USER}}
            - name: AMQP_PASSWORD
              valueFrom: {secretKeyRef: {name: declaration-gateway-rabbitmq, key: AMQP_PASSWORD}}
            - {name: PREFETCH, value: "10"}
            - {name: ZONES, value: "4"}
            # Coste simulado de validar/traducir: con 20 ms una réplica rinde ~43 msg/s y el escalado se ve con carga modesta.
            - {name: PROCESSING_DELAY_MS, value: "20"}
            - {name: FAILPOINT_STATE_DIR, value: /var/run/failpoints}
            - {name: EXPERIMENTS, value: "1"}
            - {name: GOMEMLIMIT, value: 100MiB}
          ports:
            - {name: http-ops, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /readyz, port: http-ops}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http-ops}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: failpoints, mountPath: /var/run/failpoints}
      volumes:
        - name: failpoints
          emptyDir: {}
