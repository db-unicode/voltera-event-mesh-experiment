# Lado de lectura de la región r2: matching-engine, energy-transfer (KEDA), device-sim y mesh-bridge.
# Mismos nombres de recursos en r1 y r2; cambian namespace, REGION, topic y credenciales NATS.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voltera-r2
resources:
  - ../../base/matching-engine
  - ../../base/energy-transfer
  - ../../base/device-sim
  - ../../base/mesh-bridge
# Credenciales de desarrollo (mismas que deploy/mesh/nats/r2/nats.conf): este repo es un experimento.
secretGenerator:
  - name: device-command-key
    literals:
      - DEVICE_COMMAND_KEY=dev-device-command-key-7c1d
  - name: mesh-bridge-credentials
    literals:
      - NATS_USER=bridge-r2
      - NATS_PASSWORD=dev-bridge-r2-8e60
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: REGION, value: r2}
  - target: {kind: ScaledObject, name: energy-transfer}
    patch: |-
      - op: replace
        path: /spec/triggers/0/metadata/topic
        value: r2.energy-matched
