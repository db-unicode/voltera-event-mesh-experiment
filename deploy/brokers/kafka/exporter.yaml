# kafka-exporter (danielqsj): lag por grupo/partición. Prometheus lo descubre por anotación
# (Istio fusiona el puerto de métricas del pod en 15020, fuera del mTLS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: voltera-infra
  labels: {app: kafka-exporter}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka-exporter}
  template:
    metadata:
      labels: {app: kafka-exporter}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9308"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.10.0
          args:
            - --kafka.server=kafka.voltera-infra.svc:9092
            - --web.listen-address=:9308
            - --kafka.version=2.8.0
          ports:
            - {name: http-metrics, containerPort: 9308}
          readinessProbe:
            httpGet: {path: /healthz, port: http-metrics}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  namespace: voltera-infra
  labels: {app: kafka-exporter}
spec:
  selector: {app: kafka-exporter}
  ports:
    - {name: http-metrics, port: 9308, targetPort: http-metrics}
