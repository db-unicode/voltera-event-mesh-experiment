# Capa L3/L4 del acceso de KEDA. El management API (15672) admite texto plano (security.yaml), y el texto
# plano no trae identidad que una AuthorizationPolicy pueda comparar. Aquí se limita el origen: solo los pods del
# operador de KEDA. El resto de puertos queda abierto a la red de pods porque ahí manda mTLS STRICT + AuthorizationPolicy.
# kindnet aplica NetworkPolicy (comprobado: un curl desde otro namespace a 15672 expira).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
spec:
  podSelector:
    matchLabels: {app: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 5672, protocol: TCP}    # AMQP (mTLS, entra por el sidecar)
        - {port: 15692, protocol: TCP}   # plugin prometheus (mTLS)
        - {port: 15020, protocol: TCP}   # métricas fusionadas del sidecar (las scrapea Prometheus)
        - {port: 15021, protocol: TCP}   # readiness del sidecar
        - {port: 15090, protocol: TCP}   # estadísticas de Envoy
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: keda}
          podSelector:
            matchLabels: {app.kubernetes.io/name: keda-operator}
      ports:
        - {port: 15672, protocol: TCP}   # management API para el scaler rabbitmq
