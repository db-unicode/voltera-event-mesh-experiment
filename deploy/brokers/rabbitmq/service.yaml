apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app: rabbitmq}
spec:
  selector: {app: rabbitmq}
  ports:
    - {name: tcp-amqp, port: 5672, targetPort: 5672}
    - {name: http-management, port: 15672, targetPort: 15672}
    - {name: http-prometheus, port: 15692, targetPort: 15692}
---
# Servicio de gobierno del StatefulSet (DNS estable del pod)
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  labels: {app: rabbitmq}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: rabbitmq}
  ports:
    - {name: tcp-amqp, port: 5672, targetPort: 5672}
