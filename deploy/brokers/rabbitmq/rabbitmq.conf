# Se suma a conf.d/10-defaults.conf de la imagen (no lo reemplaza).
load_definitions = /etc/rabbitmq/definitions/definitions.json

# 1 nodo en kind: techo de memoria bajo para no competir con el resto
vm_memory_high_watermark.absolute = 384MiB
disk_free_limit.absolute = 256MiB

# Estadísticas de colas cada 5 s (valor por defecto, explícito: define la latencia de rabbitmq_queue_messages_ready)
collect_statistics_interval = 5000

# El plugin rabbitmq_prometheus ya viene activo en la imagen; 15692 sirve /metrics, /metrics/per-object y /metrics/detailed
prometheus.return_per_object_metrics = false
