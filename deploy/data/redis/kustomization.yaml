# Base reutilizable: un Redis (vista de lectura) por servicio dueño de datos.
# El nombre base es "view"; cada instancia lo prefija (p. ej. namePrefix "market-" -> market-view).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
secretGenerator:
  - name: view-credentials
    literals:
      - REDIS_PASSWORD=voltera-dev
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: voltera
      app.kubernetes.io/component: data
    includeSelectors: true
