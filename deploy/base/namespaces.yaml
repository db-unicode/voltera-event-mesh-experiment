# Namespaces del experimento. Todos dentro del mesh (sidecar + mTLS STRICT).
apiVersion: v1
kind: Namespace
metadata:
  name: voltera-infra   # brokers compartidos: Kafka y RabbitMQ (prefijo/vhost por región)
  labels: {istio-injection: enabled}
---
apiVersion: v1
kind: Namespace
metadata:
  name: voltera-r1      # Región 1 (principal)
  labels: {istio-injection: enabled, voltera.io/region: r1}
---
apiVersion: v1
kind: Namespace
metadata:
  name: voltera-r2      # Región 2 (nueva, poca carga)
  labels: {istio-injection: enabled, voltera.io/region: r2}
---
apiVersion: v1
kind: Namespace
metadata:
  name: voltera-global  # Nodo global del event mesh y Facturación
  labels: {istio-injection: enabled}
