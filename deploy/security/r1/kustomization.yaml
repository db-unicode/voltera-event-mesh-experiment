# Políticas de seguridad de la región r1 (mise run security:up r1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voltera-r1
resources:
  - ../positions-db
patches:
  - target: {kind: AuthorizationPolicy, name: positions-db}
    patch: |-
      - op: replace
        path: /spec/rules/0/from/0/source/principals/0
        value: cluster.local/ns/voltera-r1/sa/declaration-gateway
